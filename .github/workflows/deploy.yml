name: Deploy

# Compose deploy — superseded by deploy-k8s.yml. Kept as a manual fallback:
# it binds :80/:443, which the cluster's Traefik now owns, so it must not fire
# on push. Run it only after `sudo systemctl stop k3s`.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/digital-cv
            git pull origin main
            docker rm -f $(docker ps -aq) 2>/dev/null || true
            docker-compose up --build -d
