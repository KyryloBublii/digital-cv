<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Kyrylo Bublii{% endblock %}</title>
  <meta name="description" content="{% block description %}Kyrylo Bublii — backend developer specialising in Python, Java and PostgreSQL. Available for freelance projects.{% endblock %}" />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="{{ canonical }}" />

  <!-- Open Graph -->
  <meta property="og:title"       content="{{ self.title() }}" />
  <meta property="og:description" content="{{ self.description() }}" />
  <meta property="og:url"         content="{{ canonical }}" />
  <meta property="og:type"        content="{% block og_type %}website{% endblock %}" />
  <meta property="og:image"       content="{% block og_image %}{{ BASE_URL }}/static/images/og-default.jpg{% endblock %}" />

  <!-- Google Analytics GA4 — only loaded after explicit cookie consent (GDPR) -->
  {% if request.cookies.get('analytics_consent') == 'true' %}
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-P72GYCD944"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-P72GYCD944');
    window._gaLoaded = true;
    /* Track SPA navigations via HTMX boost */
    if (!window._gaHtmxHooked) {
      window._gaHtmxHooked = true;
      document.addEventListener('htmx:afterSwap', function () {
        gtag('event', 'page_view', { page_path: window.location.pathname });
      });
    }
  </script>
  {% endif %}
  <noscript><!-- GA4 not loaded: JavaScript is required --></noscript>

  <!-- JSON-LD structured data (page-specific) -->
  {% block structured_data %}{% endblock %}

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Custom CSS — loaded last to override CDN resets -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}" />

  <!-- HTMX 2
       hx-boost on <body> swaps <main id="content"> for SPA-like navigation.
       All page content is server-rendered — crawlers receive full HTML on direct URL requests.
       No SEO-critical content depends on HTMX swaps. -->
  <script src="https://unpkg.com/htmx.org@2/dist/htmx.min.js"></script>
</head>
<body hx-boost="true">

<!-- ════ NAV ════════════════════════════════════════════════════ -->
<nav>
  <div class="nav-inner">
    <a href="{{ url_for('index') }}" class="nav-logo">Kyrylo Bublii</a>
    <ul class="nav-links">
      <li><a href="{{ url_for('index') }}"    {% if active_page == 'home'     %}class="active"{% endif %}>Home</a></li>
      <li><a href="{{ url_for('projects') }}" {% if active_page == 'projects' %}class="active"{% endif %}>Projects</a></li>
      <li><a href="{{ url_for('about') }}"    {% if active_page == 'about'    %}class="active"{% endif %}>About Me</a></li>
      <li><a href="{{ url_for('contact') }}"  {% if active_page == 'contact'  %}class="active"{% endif %}>Contact</a></li>
    </ul>
    <div class="nav-right">
<a href="{{ url_for('contact') }}" class="nav-hire">Hire Me →</a>
    </div>
  </div>
</nav>

<!-- ════ CONTENT ════════════════════════════════════════════════ -->
<main id="content">
  {% block content %}{% endblock %}
</main>

<script>
  /* Scroll reveal — guard against re-declaration on HTMX navigations */
  if (!window._revealIO) {
    window._revealIO = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('on'); window._revealIO.unobserve(e.target); }
      });
    }, { threshold: 0.07 });
  }
  document.querySelectorAll('.rv').forEach(el => window._revealIO.observe(el));

  /* Re-run reveal after HTMX swaps content */
  document.body.addEventListener('htmx:afterSwap', () => {
    document.querySelectorAll('.rv:not(.on)').forEach(el => window._revealIO.observe(el));
  });
</script>

<!-- Cookie consent banner — shown only when no choice has been stored -->

</body>
</html>
