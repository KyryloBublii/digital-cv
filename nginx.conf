# Redirect all HTTP → HTTPS
server {
    listen 80;
    server_name kyrylobublii.com www.kyrylobublii.com;
    return 301 https://kyrylobublii.com$request_uri;
}

# Redirect www → non-www (HTTPS)
server {
    listen 443 ssl;
    server_name www.kyrylobublii.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    return 301 https://kyrylobublii.com$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name kyrylobublii.com;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Gzip — Cloudflare handles Brotli at the edge; this is the origin-side fallback
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types
        text/html
        text/plain
        text/css
        application/json
        application/javascript
        application/xml
        text/xml;

    # Static assets — 1-year immutable cache
    location /static/ {
        alias /app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # Flask app
    location / {
        proxy_pass         http://web:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control     "no-cache, no-store, must-revalidate";
    }
}
